syntax = "proto3";

package querysession.v1;

// Keep the public query-session protocol independent of backend Invoke messages.
enum QueryType {
  QUERY_UNSPECIFIED = 0;
  QUERY_LABEL_NAMES = 1;
  QUERY_LABEL_VALUES = 2;
  QUERY_SERIES_LABELS = 3;
}

// JSON-only, uncompressed WebSocket protocol exposed by query-frontends.
// Each text frame is one SessionRequest or SessionFrame encoded with protobuf
// JSON, using proto field names. Request IDs multiplex independent operations.
message SessionRequest {
  string id = 1;
  oneof payload {
    SessionQuery query = 2;
    SessionNext next = 3;
    SessionCancel cancel = 4;
    SessionResetRequest reset_string_table = 5;
  }
}

message SessionQuery {
  // Only QUERY_SERIES_LABELS, QUERY_LABEL_NAMES, and QUERY_LABEL_VALUES are valid.
  QueryType query_type = 1;
  int64 start = 2;
  int64 end = 3;
  repeated string matchers = 4;
  repeated string label_names = 5;
  string name = 6;
  uint32 page_size = 7;
}

message SessionNext {
  string next_token = 1;
  // Zero retains the original query page size. Nonzero must match it.
  uint32 page_size = 2;
}

message SessionCancel {
  string target_id = 1;
}

// Requests a reset at the server's next serialized writer boundary. The client
// must not clear its table until it receives the corresponding SessionTableReset.
message SessionResetRequest {}

message SessionFrame {
  // Empty only for an unsolicited, server-initiated table reset.
  string id = 1;
  oneof payload {
    SessionPage page = 2;
    SessionComplete complete = 3;
    SessionError error = 4;
    SessionTableReset table_reset = 5;
  }
}

message SessionPage {
  QueryType query_type = 1;
  uint32 table_epoch = 2;
  SessionStringDelta strings = 3;
  repeated SessionLabelSet series = 4;
  // LabelNames and LabelValues pages reference strings directly.
  repeated uint32 refs = 5;
  string next_token = 6;
}

message SessionStringDelta {
  uint32 start = 1;
  repeated string values = 2;
}

message SessionLabelSet {
  repeated SessionLabelRef labels = 1;
}

message SessionLabelRef {
  uint32 key = 1;
  uint32 value = 2;
}

message SessionComplete {
  bool query_complete = 1;
}

message SessionError {
  string code = 1;
  string message = 2;
}

// Authoritative reset barrier, ordered with all pages by the server's writer.
// Epoch starts at zero; each reset increments it exactly once. IDs restart at
// zero in the new epoch. No page referencing the old epoch may follow a reset.
// Client-initiated resets carry the request ID and are followed by completion;
// server-initiated resets have no ID and need no acknowledgement from the client.
// Neither reset changes query execution, deduplication, cursors, or cached pages.
message SessionTableReset {
  uint32 epoch = 1;
}
