services:
  pyroscope:
    image: grafana/pyroscope:latest
    environment:
    - PYROSCOPE_V2_EXPERIMENT=yes
    command:
    - -enable-query-backend=true
    - -storage.backend=filesystem
    - -storage.filesystem.dir=/data/v2/shared
    - -write-path=segment-writer
    volumes:
    - pyroscope-data:/data
    ports:
    - 4040:4040
  us-east:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=us-east
    - PYROSCOPE_LABELS=region:us-east
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
  eu-north:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=eu-north
    - PYROSCOPE_LABELS=region:eu-north
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
  ap-south:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=ap-south
    - PYROSCOPE_LABELS=region:ap-south
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
  ap-south-alpine:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=ap-south
    - PYROSCOPE_LABELS=region:ap-south-alpine
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    build:
      context: .
      dockerfile: musl.Dockerfile
  us-east-net10:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=us-east
    - PYROSCOPE_LABELS=region:us-east-net10
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
      args:
        SDK_VERSION: "10.0"
        SDK_IMAGE_TAG: "10.0-noble"
        RUNTIME_IMAGE_TAG: "10.0-noble"
  load-generator:
    build:
      context: .
      dockerfile: Dockerfile.load-generator
    depends_on:
    - pyroscope
    - us-east
    - eu-north
    - ap-south
    - ap-south-alpine
    - us-east-net10
  grafana:
    image: grafana/grafana:latest
    environment:
    - GF_PLUGINS_PREINSTALL_SYNC=grafana-pyroscope-app
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
    - ./grafana-provisioning:/etc/grafana/provisioning
    ports:
    - 3000:3000

volumes:
  pyroscope-data:
