services:
  pyroscope:
    image: grafana/pyroscope:latest
    ports:
    - 4040:4040
  us-east:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=us-east
    - PYROSCOPE_LABELS=region:us-east
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
  eu-north:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=eu-north
    - PYROSCOPE_LABELS=region:eu-north
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
      dockerfile: Dockerfile.eu-north
  ap-south:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=ap-south
    - PYROSCOPE_LABELS=region:ap-south
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
  ap-south-alpine:
    platform: linux/amd64
    ports:
    - 5000
    environment:
    - REGION=ap-south
    - PYROSCOPE_LABELS=region:ap-south-alpine
    - PYROSCOPE_SERVER_ADDRESS=http://pyroscope:4040
    - RIDESHARE_LISTEN_PORT=5000
    build:
      context: .
      dockerfile: musl.Dockerfile
  sonarr:
    platform: linux/amd64
    ports:
    - 8989:8989
    environment:
    - PUID=1000
    - PGID=1000
    - TZ=Etc/UTC
    build:
      context: .
      dockerfile: Dockerfile.sonarr
  load-generator:
    build:
      context: .
      dockerfile: Dockerfile.load-generator
    depends_on:
    - pyroscope
    - us-east
    - eu-north
    - ap-south
    - ap-south-alpine
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - 8080:8080
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana:latest
    environment:
    - GF_PLUGINS_PREINSTALL_SYNC=grafana-pyroscope-app
    - GF_AUTH_ANONYMOUS_ENABLED=true
    - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
    - ./grafana-provisioning:/etc/grafana/provisioning
    ports:
    - 3000:3000
