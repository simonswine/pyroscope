apiVersion: v1
kind: Namespace
metadata:
  name: pyroscope-ebpf
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole # needed for the discovery.kubernetes alloy component
metadata:
  name: grafana-alloy-role
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana-alloy
  namespace: pyroscope-ebpf
---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: grafana-alloy-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: grafana-alloy-role
subjects:
  - kind: ServiceAccount
    name: grafana-alloy
    namespace: pyroscope-ebpf

---

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: grafana-alloy
  namespace: pyroscope-ebpf
spec:
  selector:
    matchLabels:
      app: grafana-alloy
  template:
    metadata:
      labels:
        app: grafana-alloy
    spec:
      serviceAccountName: grafana-alloy
      containers:
        - name: grafana-alloy
          image: grafana/alloy:latest
          command:
            - /bin/alloy
            - run
            - /etc/alloy-config/config.alloy
            - --server.http.listen-addr=0.0.0.0:12345
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 12345
          volumeMounts:
            - name: alloy-config
              mountPath: /etc/alloy-config
            - name: sys-kernel-debug
              mountPath: /sys/kernel/debug
              readOnly: true
            - name: sys-kernel-tracing
              mountPath: /sys/kernel/tracing
              readOnly: true
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            # AppArmor (Ubuntu/Debian nodes) and SELinux (RHEL/CentOS nodes) enforce their own
            # policies after capability checks. Without Unconfined, the default container profile
            # blocks opening /proc/<pid>/map_files/* magic-links even with SYS_PTRACE present,
            # causing "operation not permitted" errors when reading ELF files for symbol resolution.
            appArmorProfile:
              type: Unconfined
            seccompProfile:
              type: Unconfined
            capabilities:
              add:
                - BPF               # load and manage eBPF programs and maps
                - PERFMON           # attach perf events and read performance counters used by eBPF
                - SYS_PTRACE        # satisfies the ptrace_may_access() credential check when accessing /proc/<pid>/ entries
                - CHECKPOINT_RESTORE # allows following magic-links in /proc/<pid>/map_files/* for ELF symbol reading (requires kernel 5.9+; on older kernels SYS_ADMIN is needed instead); without this, opening map_files entries returns EPERM even with SYS_PTRACE
                - SYS_RESOURCE      # raise RLIMIT_MEMLOCK so eBPF maps can be locked in memory
                - DAC_READ_SEARCH   # bypass DAC read/search permission bits when opening ELF binaries and /proc entries (does NOT bypass LSM — see appArmorProfile above)
                - SYSLOG            # read kernel ring buffer (dmesg) for eBPF verifier errors and kernel log output
      volumes:
        - name: alloy-config
          configMap:
            name: alloy-config
        - name: sys-kernel-debug
          hostPath:
            path: /sys/kernel/debug
        - name: sys-kernel-tracing
          hostPath:
            path: /sys/kernel/tracing

      hostPID: true

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: pyroscope-ebpf
data:
  config.alloy: |
    // This is an example grafana alloy config to set up eBPF profiling in kubernetes.
    // for more info see https://grafana.com/docs/pyroscope/latest/configure-client/grafana-alloy/ebpf/setup-kubernetes/
    logging {
      level = "debug"
      format = "logfmt"
    }
    
    discovery.kubernetes "local_pods" {
        selectors {
          field = "spec.nodeName=" + env("HOSTNAME") // Note: this assume HOSTNAME is set to the node name
          role = "pod"
        }
        role = "pod"
    }
    
    discovery.relabel "specific_pods" {
      targets = discovery.kubernetes.local_pods.targets
      rule {
        action = "drop"
        regex = "Succeeded|Failed|Completed"
        source_labels = ["__meta_kubernetes_pod_phase"]
      }
      
      rule {
        action = "replace"
        source_labels = ["__meta_kubernetes_namespace"]
        target_label = "namespace"
      }
      rule {
        action = "replace"
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label = "pod"
      }
      rule {
        action = "replace"
        source_labels = ["__meta_kubernetes_pod_node_name"]
        target_label = "node"
      }
      
      rule {
        action = "replace"
        source_labels = ["__meta_kubernetes_pod_container_name"]
        target_label = "container"
      }
      
      // provide arbitrary service_name label, otherwise it will be set to {__meta_kubernetes_namespace}/{__meta_kubernetes_pod_container_name}
      rule {
        action = "replace"
        regex = "(.*)@(.*)"
        replacement = "${1}/${2}"
        separator = "@"
        source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_container_name"]
        target_label = "service_name"
      }
      
      // Filter specific targets to profile
      rule {
        source_labels = ["service_name"]
        regex = "(.*alloy|.*pyroscope|.*fast-slow)"
        action = "keep"
      }
    }
    
    pyroscope.ebpf "instance" {
        forward_to = [pyroscope.write.endpoint.receiver]
        targets = discovery.relabel.specific_pods.output
        python_enabled = true
    }
    
    pyroscope.write "endpoint" {
        endpoint {
          url = "http://pyroscope.pyroscope-ebpf.svc.cluster.local.:4040"
          // url = "<Grafana Cloud URL>"
          // basic_auth {
          //  username = "<Grafana Cloud User>"
          //  password = "<Grafana Cloud Password>"
          // }
        }
    }
---
